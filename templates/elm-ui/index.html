<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Today, gently · Elm</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f2ec;color:#24251f;font:14px system-ui,sans-serif}.page{min-height:100vh;display:grid;place-content:center;padding:24px}.card{width:min(440px,calc(100vw - 40px));background:#fbfaf6;border:1px solid #e1e0d8;border-radius:8px;padding:30px;box-shadow:0 20px 60px #2526200c}.eyebrow,.footnote{font:9px ui-monospace,monospace;letter-spacing:1px;color:#7e8076}.card h1{font-size:34px;letter-spacing:-1.5px;margin:22px 0 6px}.count{font-size:12px;color:#7b7d73}.meter{height:5px;border-radius:4px;background:#e8e8df;margin:22px 0}.meter-fill{height:100%;background:#8da16a;border-radius:4px;transition:width .2s}.tasks{list-style:none;margin:0;padding:0}.task{display:flex;gap:12px;align-items:center;border-top:1px solid #eeede6;padding:15px 0;font-size:12px}.is-done span{color:#85877e;text-decoration:line-through}.check{width:18px;height:18px;border:1px solid #ced0c5;border-radius:50%;background:transparent;color:#4e7255;cursor:pointer}.is-done .check{background:#e2edcd;border:0}.add-row{display:flex;gap:8px;margin-top:15px}.add-row input{flex:1;min-width:0;border:1px solid #deded6;border-radius:4px;background:#fffefa;padding:10px;font:11px system-ui}.add-row button{width:38px;border:0;border-radius:4px;background:#24251f;color:white;font-size:18px;cursor:pointer}.footnote{text-align:center;margin-top:22px;font-size:8px}</style></head><body><div id="app"></div><script src="elm.js"></script><script>Elm.Main.init({node:document.getElementById('app')});</script></body></html>
